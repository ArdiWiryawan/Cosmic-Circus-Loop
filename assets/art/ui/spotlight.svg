<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="title" data-art-id="spotlight">
<title id="title">Spotlight</title>
<defs>
  <radialGradient id="uiGlow" cx="50%" cy="42%" r="62%">
    <stop offset="0" stop-color="#ffd700" stop-opacity=".18"/>
    <stop offset="1" stop-color="#ffd700" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3" result="b"/>
